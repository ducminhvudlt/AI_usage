name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install GTK + AppIndicator introspection
        run: |
          sudo apt-get update
          # gir1.2-* pulls in the GTK runtime libs transitively (the
          # runtime package name differs across runner images:
          # libgtk-3-0t64 on 24.04, libgtk-3-0/1 elsewhere).
          sudo apt-get install -y \
            gir1.2-gtk-3.0 gir1.2-appindicator3-0.1 xvfb \
            libcairo2-dev libdbus-1-dev pkg-config
          # PyGObject >= 3.52 builds against girepository-2.0 (the
          # package is provided by gobject-introspection 1.80+, i.e. the
          # 24.04 image). Older images only ship 1.x headers, which need
          # a pinned-down PyGObject — try 2.0 first.
          sudo apt-get install -y libgirepository-2.0-dev \
            || sudo apt-get install -y libgirepository1.0-dev

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Mock test suite
        run: python -m pytest -q --tb=short

      - name: Real-GTK integration suite (opt-in, on Xvfb)
        env:
          CUSTATS_GTK_TESTS: "1"
        run: xvfb-run -a python -m pytest tests/ui/test_gtk_integration.py -v

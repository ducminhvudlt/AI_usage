name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install GTK + AppIndicator introspection
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-1 gir1.2-gtk-3.0 gir1.2-appindicator3-0.1 xvfb \
            libgirepository1.0-dev libcairo2-dev libdbus-1-dev pkg-config \
            python3-dev

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Mock test suite
        run: pytest -q --tb=short

      - name: Real-GTK integration suite (opt-in, on Xvfb)
        env:
          CUSTATS_GTK_TESTS: "1"
        run: xvfb-run -a pytest tests/ui/test_gtk_integration.py -v

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "custats"
version = "0.1.0"
description = "Linux menu bar app that tracks Claude, Codex, Grok, and Cursor usage limits in real time."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "custats authors" },
]
keywords = ["claude", "codex", "grok", "cursor", "menu-bar", "usage", "limits"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = [
    "cryptography>=42",
    "httpx>=0.27",
    "PyGObject>=3.50; platform_system == 'Linux'",
    "dbus-python>=1.3; platform_system == 'Linux'",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[project.scripts]
custats = "custats.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
custats = [
    "py.typed",
    "packaging/custats.service",
    "packaging/custats.desktop",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["src"]
asyncio_mode = "auto"
